name: Docker Image CI

on:
  push:
    branches: '**'
  pull_request:
    branches: [ master ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Login to Docker Hub
      if: github.event_name == 'push'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_HUB_USER }}
        password: ${{ secrets.DOCKER_HUB_PASSWORD }}
    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: ${{ github.event_name == 'push' }}
        tags: ${{ github.event_name == 'push' && format('virtualflybrain/vfb-pipeline-dumps:{0}', github.ref_name) || format('virtualflybrain/vfb-pipeline-dumps:pr-{0}', github.event.number) }}

    
